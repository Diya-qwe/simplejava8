
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplejava8
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simplejava8
  template:
    metadata:
      labels:
        app: simplejava8
    spec:
      containers:
        - name: java-app
          image: diyasree/simplejava8:latest
          imagePullPolicy: Always
